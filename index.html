<head>
    <meta charset="UTF-8">

    <!-- ============================================

    <title>Seitentitel – Hemera Academy</title>

    <!-- ============================================
         GEMEINSAME RESSOURCEN (nicht ändern)
         ============================================ -->

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Hemera Schriften: Inter (Fließtext) + Playfair Display (Überschriften) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Material Components Web CSS -->
    <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">

    <!-- ============================================
         HEMERA BASE STYLES (nicht ändern)
         ============================================ -->
    <style>
        /* ── Design Tokens ── */
        :root {
            --hemera-cream: #FBF5DD;
            --hemera-petrol: #16404D;
            --hemera-petrol-light: #2A5A6A;
            --hemera-petrol-dark: #0D2A33;
            --hemera-gold: #DDA853;
            --hemera-gold-light: #E5BC75;
            --hemera-gold-dark: #C99744;
            --hemera-sage: #A6CDC6;
            --hemera-sage-light: #B8D9D2;
            --hemera-sage-dark: #8FBFB6;
            --hemera-white: #FFFFFF;
            --hemera-border-radius: 8px;
            --hemera-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12);
            --hemera-shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --hemera-shadow-lg: 0 10px 20px rgba(0, 0, 0, 0.15);
            --hemera-max-width: 1200px;
            --foreground-rgb: 22, 64, 77;
        }

        /* ── Reset ── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ── Basis ── */
        html, body {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            font-family: 'Inter', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--hemera-petrol);
            background-color: var(--hemera-cream);
        }

        /* ── Typografie ── */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--hemera-petrol);
        }
        h1 { font-size: 2.5rem; margin-bottom: 0.5em; }
        h2 { font-size: 2rem; margin-bottom: 0.5em; }
        h3 { font-size: 1.5rem; margin-bottom: 0.4em; }
        h4 { font-size: 1.25rem; margin-bottom: 0.4em; }
        h5 { font-size: 1.1rem; letter-spacing: 0.02em; margin-bottom: 0.3em; }
        h6 { font-size: 1rem; margin-bottom: 0.3em; }

        p { margin-bottom: 1em; }

        a {
            color: var(--hemera-gold);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        a:hover {
            color: var(--hemera-gold-dark);
        }

        /* ── Layout-Hilfsklassen ── */
        .container {
            width: 100%;
            max-width: var(--hemera-max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        .card {
            background: var(--hemera-white);
            border-radius: var(--hemera-border-radius);
            box-shadow: var(--hemera-shadow-sm);
            padding: 24px;
        }

        /* ── Buttons (Hemera-Stil) ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border: none;
            border-radius: var(--hemera-border-radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary {
            background-color: var(--hemera-petrol);
            color: var(--hemera-cream);
        }
        .btn-primary:hover {
            background-color: var(--hemera-petrol-light);
            box-shadow: var(--hemera-shadow-md);
        }
        .btn-secondary {
            background-color: var(--hemera-gold);
            color: var(--hemera-petrol);
        }
        .btn-secondary:hover {
            background-color: var(--hemera-gold-dark);
            box-shadow: var(--hemera-shadow-md);
        }
        .btn-outline {
            background-color: transparent;
            color: var(--hemera-petrol);
            border: 2px solid var(--hemera-petrol);
        }
        .btn-outline:hover {
            background-color: var(--hemera-petrol);
            color: var(--hemera-cream);
        }
    </style>

    <!-- ============================================
         VORLAGE: Seitenspezifische Styles hier
         ============================================ -->
    <style>
        /* Seitenspezifische Styles hier einfügen */
    </style>
</head>

        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <p style="margin: 0;">&copy; 2026 Hemera Academy</p>
