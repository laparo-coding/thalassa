<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self';">
    <title>Videoanalyse – Hemera Academy</title>

    <!-- Hemera Schriften -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── Design Tokens ── */
        :root {
            --hemera-cream: #FBF5DD;
            --hemera-petrol: #16404D;
            --hemera-petrol-light: #2A5A6A;
            --hemera-petrol-dark: #0D2A33;
            --hemera-gold: #DDA853;
            --hemera-gold-light: #E5BC75;
            --hemera-sage: #A6CDC6;
            --hemera-sage-light: #B8D9D2;
            --hemera-white: #FFFFFF;
            --hemera-border-radius: 8px;
            --hemera-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12);
            --hemera-red: #D32F2F;
        }

        /* ── Reset ── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ── Fullscreen-Layout wie aither HD Web Player ── */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            background: #000;
        }

        .viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewport video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ── Recording-Indicator (oben links) ── */
        .recording-indicator {
            position: absolute;
            top: 16px;
            left: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 10;
        }
        .recording-indicator.active { display: flex; }
        .recording-indicator .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--hemera-red);
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ── Timer (oben rechts) ── */
        .timer {
            position: absolute;
            top: 16px;
            right: 16px;
            display: none;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-family: 'Inter', monospace;
            font-weight: 600;
            letter-spacing: 0.05em;
            z-index: 10;
        }
        .timer.active { display: block; }
        .timer.warning { color: var(--hemera-gold); }
        .timer.critical { color: var(--hemera-red); animation: blink 0.5s infinite; }

        /* ── Status-Overlay (zentriert) ── */
        .status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .status-overlay.visible { opacity: 1; }
        .status-overlay .sub {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #999;
            margin-top: 8px;
        }

        /* ── Verbindungs-Indikator (oben rechts, unter Timer) ── */
        .connection-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
            font-size: 0.75rem;
            z-index: 10;
        }
        .connection-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }
        .connection-indicator.connected .dot { background: #4CAF50; }
        .connection-indicator.connected { color: #4CAF50; }

        /* ── Error-Overlay ── */
        .error-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--hemera-red);
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            text-align: center;
            z-index: 20;
            display: none;
        }
        .error-overlay.visible { display: block; }
    </style>
</head>
<body>

    <!-- ── Vollbild-Viewport (wie aither player/[id]/page.tsx) ── -->
    <div class="viewport">
        <!-- Kamera-Preview (Aufnahme) / Playback-Video -->
        <video id="videoElement" autoplay muted playsinline></video>

        <!-- Recording-Indikator -->
        <div id="recordingIndicator" class="recording-indicator">
            <span class="dot"></span>
            <span>REC</span>
        </div>

        <!-- Timer -->
        <div id="timer" class="timer">00:00</div>

        <!-- SSE-Verbindungsstatus -->
        <div id="connectionIndicator" class="connection-indicator">
            <span class="dot"></span>
            <span>Verbinde…</span>
        </div>

        <!-- Status-Meldungen (wird kurz bei Aktionen eingeblendet) -->
        <div id="statusOverlay" class="status-overlay">
            <div id="statusText">Bereit</div>
            <div id="statusSub" class="sub"></div>
        </div>

        <!-- Fehler-Overlay -->
        <div id="errorOverlay" class="error-overlay"></div>
    </div>

    <!-- ============================================================
         RECORDING ENGINE — API-gesteuert (aither Spec 004)
         ─────────────────────────────────────────────────────
         Architektur:
         - Aufnahme: Server-seitig via FFmpeg (RTSP → MP4)
         - Player:   Diese Seite zeigt Status + Wiedergabe
         - Steuerung via SSE (/api/recording/events)

         Kommandos (empfangen):
         • start-recording  → Status-Overlay "Aufnahme läuft"
         • stop-recording   → Status-Overlay "Aufnahme beendet"
         • play / stop / seek / rewind / forward → Wiedergabe

         State-Reports (gesendet):
         • POST /api/recording/playback/state

         Kamera-Konfiguration:
         • RTSP-Stream wird vom aither-Server per FFmpeg aufgenommen
         • Reolink-Kamera über WLAN: 192.168.8.130:554
         ============================================================ -->
    <script>
        // ── Kamera-Konfiguration (Reolink WLAN-Webcam) ──
        const CAMERA_CONFIG = {
            ip: '192.168.8.130',
            port: 554,
            user: 'aither',
            password: 'zyfMap-junbof-mewfo6',
            // RTSP-URLs (Reolink-Format)
            rtspMain: 'rtsp://aither:zyfMap-junbof-mewfo6@192.168.8.130:554/h264Preview_01_main',
            rtspSub:  'rtsp://aither:zyfMap-junbof-mewfo6@192.168.8.130:554/h264Preview_01_sub',
            // Baichuan-Protokoll (proprietär, Port 9000)
            baichuanPort: 9000,
        };

        // ── Server-Konfiguration ──
        // Aither-Server-URL — aus URL-Parameter ?api=... oder Default
        const API_BASE = new URLSearchParams(window.location.search).get('api') || '';

        const MAX_DURATION_SEC = 15 * 60;
        const WARNING_SEC = 14 * 60;

        // ── State ──
        let timerInterval = null;
        let elapsedSeconds = 0;
        let currentRecordingId = null;
        let isRecording = false;
        let eventSource = null;

        // ── DOM ──
        const videoEl = document.getElementById('videoElement');
        const recIndicator = document.getElementById('recordingIndicator');
        const timerEl = document.getElementById('timer');
        const connIndicator = document.getElementById('connectionIndicator');
        const statusOverlay = document.getElementById('statusOverlay');
        const statusText = document.getElementById('statusText');
        const statusSub = document.getElementById('statusSub');
        const errorOverlay = document.getElementById('errorOverlay');

        // ── SSE-Verbindung (wie aither EventSource an /api/recording/events) ──
        function connectSSE() {
            const url = `${API_BASE}/api/recording/events`;
            eventSource = new EventSource(url);

            eventSource.addEventListener('connected', () => {
                setConnected(true);
                showStatus('Verbunden', 'Warte auf Kommandos…');
                // Kamera-Konfiguration an Server melden
                registerCamera();
            });

            eventSource.addEventListener('command', (event) => {
                try {
                    const command = JSON.parse(event.data);
                    handleCommand(command);
                } catch {
                    // Ungültige SSE-Daten ignorieren
                }
            });

            eventSource.onerror = () => {
                setConnected(false);
                // Automatischer Reconnect durch EventSource
            };

            eventSource.onopen = () => {
                setConnected(true);
            };
        }

        // ── Kamera-Registrierung beim Server ──
        async function registerCamera() {
            try {
                await fetch(`${API_BASE}/api/recording/playback/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        state: 'ready',
                        position: 0,
                        camera: {
                            rtspUrl: CAMERA_CONFIG.rtspMain,
                            ip: CAMERA_CONFIG.ip,
                        },
                    }),
                });
            } catch {
                // Best-effort
            }
        }

        // ── Kommando-Handler ──
        function handleCommand(command) {
            switch (command.action) {
                case 'start-recording':
                    startRecording(command.recordingId);
                    break;
                case 'stop-recording':
                    stopRecording();
                    break;
                case 'play':
                    playVideo(command.recordingId, command.position);
                    break;
                case 'stop':
                    pauseVideo();
                    break;
                case 'seek':
                    seekVideo(command.position);
                    break;
                case 'rewind':
                    seekVideo(Math.max(0, videoEl.currentTime - (command.seconds || 10)));
                    break;
                case 'forward':
                    seekVideo(videoEl.currentTime + (command.seconds || 10));
                    break;
            }
        }

        // ── Verbindungs-Indikator ──
        function setConnected(connected) {
            connIndicator.className = 'connection-indicator' + (connected ? ' connected' : '');
            connIndicator.querySelector('span:last-child').textContent =
                connected ? 'Verbunden' : 'Verbinde…';
        }

        // ── Status-Overlay (blendet sich nach 2s aus) ──
        let statusTimeout = null;
        function showStatus(text, sub, duration = 2000) {
            statusText.textContent = text;
            statusSub.textContent = sub || '';
            statusOverlay.classList.add('visible');
            clearTimeout(statusTimeout);
            if (duration > 0) {
                statusTimeout = setTimeout(() => {
                    statusOverlay.classList.remove('visible');
                }, duration);
            }
        }

        function showError(message) {
            errorOverlay.textContent = message;
            errorOverlay.classList.add('visible');
        }

        function clearError() {
            errorOverlay.classList.remove('visible');
            errorOverlay.textContent = '';
        }

        // ── State-Report an Server (wie aither POST /api/recording/playback/state) ──
        async function reportState(state, position, errorMessage) {
            try {
                await fetch(`${API_BASE}/api/recording/playback/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        recordingId: currentRecordingId,
                        state,
                        position: position || 0,
                        ...(errorMessage ? { message: errorMessage } : {}),
                    }),
                });
            } catch {
                // State-Reports sind best-effort
            }
        }

        // ── Timer ──
        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer() {
            elapsedSeconds = 0;
            timerEl.textContent = '00:00';
            timerEl.className = 'timer active';

            timerInterval = setInterval(() => {
                elapsedSeconds++;
                timerEl.textContent = formatTime(elapsedSeconds);

                if (elapsedSeconds >= WARNING_SEC && elapsedSeconds < MAX_DURATION_SEC) {
                    timerEl.className = 'timer active warning';
                }
                if (elapsedSeconds >= MAX_DURATION_SEC) {
                    timerEl.className = 'timer active critical';
                    stopRecording();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timerEl.className = 'timer';
        }

        // ── Initialisierung ──
        function init() {
            showStatus('Bereit', `Kamera: ${CAMERA_CONFIG.ip}`, 0);
            reportState('ready', 0);
            console.log('[video-analysis] Kamera-Konfiguration:', {
                ip: CAMERA_CONFIG.ip,
                rtspMain: CAMERA_CONFIG.rtspMain,
                rtspSub: CAMERA_CONFIG.rtspSub,
            });
        }

        // ── Aufnahme gestartet (Server nimmt per FFmpeg auf) ──
        function startRecording(recordingId) {
            if (isRecording) return;

            clearError();
            currentRecordingId = recordingId || `rec_${Date.now()}`;
            isRecording = true;

            // UI: Recording-Indikator + Timer
            recIndicator.classList.add('active');
            connIndicator.style.display = 'none';
            startTimer();
            showStatus('Aufnahme läuft', `FFmpeg → ${CAMERA_CONFIG.ip}`, 1500);
            reportState('recording', 0);
        }

        // ── Aufnahme gestoppt (Server hat FFmpeg beendet) ──
        function stopRecording() {
            if (!isRecording) return;

            stopTimer();
            isRecording = false;

            recIndicator.classList.remove('active');
            connIndicator.style.display = 'flex';
            showStatus('Aufnahme beendet', formatTime(elapsedSeconds), 3000);
            reportState('completed', elapsedSeconds);
        }

        // ── Playback (ausgelöst durch API-Kommando) ──
        // Video wird immer vom aither-Server gestreamt: GET /api/recording/stream/{id}
        function playVideo(recordingId, position) {
            if (!recordingId && !currentRecordingId) return;

            const id = recordingId || currentRecordingId;
            videoEl.srcObject = null;
            videoEl.src = `${API_BASE}/api/recording/stream/${id}`;
            videoEl.muted = false;
            if (position) videoEl.currentTime = position;
            videoEl.play().catch((err) => {
                showError(`Wiedergabe fehlgeschlagen: ${err.message}`);
                reportState('error', videoEl.currentTime, err.message);
            });
            showStatus('Wiedergabe', '', 1500);
            reportState('playing', videoEl.currentTime);
        }

        function pauseVideo() {
            videoEl.pause();
            reportState('paused', videoEl.currentTime);
        }

        function seekVideo(position) {
            videoEl.currentTime = Math.max(0, Math.min(videoEl.duration || Infinity, position));
            reportState(videoEl.paused ? 'paused' : 'playing', videoEl.currentTime);
        }

        // ── Video-Event-Listener für State-Reporting ──
        let lastReportTimestamp = 0;
        videoEl.addEventListener('play', () => reportState('playing', videoEl.currentTime));
        videoEl.addEventListener('pause', () => reportState('paused', videoEl.currentTime));
        videoEl.addEventListener('ended', () => reportState('ended', videoEl.currentTime));
        videoEl.addEventListener('error', () => {
            reportState('error', videoEl.currentTime, 'Video playback error');
        });
        videoEl.addEventListener('timeupdate', () => {
            const now = Date.now();
            if (now - lastReportTimestamp >= 2000) {
                lastReportTimestamp = now;
                reportState(videoEl.paused ? 'paused' : 'playing', videoEl.currentTime);
            }
        });

        // ── Init ──
        init();
        connectSSE();
    </script>
</body>
</html>
